{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="shortcut icon" type="image/png" href="{% static 'images/logo.png' %}">
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <title>{% block title %}Notes App{% endblock %}</title>
</head>
<body class="min-h-screen text-slate-900 bg-slate-50">
    <div class="flex min-h-screen overflow-hidden bg-[radial-gradient(circle_at_top_left,_rgba(56,189,248,0.08),_transparent_30%),linear-gradient(180deg,#eff6ff_0%,#f8fafc_100%)]">
        {% include "partials/navbar.html" %}
        <div class="ml-80 flex min-w-0 flex-1 flex-col overflow-hidden">
            <div class="fixed top-0 left-80 right-0 z-40 flex items-center justify-between border-b border-slate-200/80 bg-white/95 px-3 py-4 shadow-sm backdrop-blur sm:px-6 sm:py-3 text-slate-900">
                <div class="flex items-center gap-3">
                    <button id="sidebarToggle" class="md:hidden inline-flex items-center justify-center rounded-lg p-2 text-slate-700 hover:bg-slate-100" aria-label="Open sidebar" aria-controls="sidebar" aria-expanded="false">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <a href="{% url 'about' %}" class="md:hidden flex items-center gap-3">
                        <img src="{% static 'images/logo.png' %}" alt="Quick Note logo" class="w-8 h-8 rounded-2xl border border-white/20 bg-white p-1">
                        <div class="leading-tight">
                            <p class="text-sm font-semibold text-slate-700"><span class="font-bold text-orange-600">Quick</span>Note</p>
                            <p class="text-xs text-slate-400">Capture ideas</p>
                        </div>
                    </a>
                    <div class="hidden md:block text-[11px] font-semibold uppercase tracking-[0.25em] text-slate-500">Workspace • Notes</div>
                </div>
                <div class="flex items-center gap-3 text-sm font-medium">
                    <div class="flex flex-col items-end rounded-2xl border border-slate-200 bg-slate-50/90 px-3 py-2 shadow-sm sm:flex-row sm:items-center sm:gap-2">
                        <span id="current-date" class="text-[11px] font-semibold text-slate-700 sm:text-sm"></span>
                        <span class="hidden text-slate-400 sm:inline">•</span>
                        <span id="current-time" class="text-[11px] font-medium text-slate-500 sm:text-sm sm:text-slate-700"></span>
                    </div>
                </div>
            </div>
            <main class="flex-1 overflow-y-auto pt-24 sm:pt-20">
                <div class="flex min-h-[calc(100vh-4rem)] flex-col">
                    <div class="flex-1">
                        {% block content %}{% endblock %}
                    </div>
                    {% include "partials/footer.html" %}
                </div>
            </main>
        </div>
    </div>

    <div id="confirmModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-100/80 px-4" aria-hidden="true">
        <div class="w-full max-w-md rounded-3xl border border-slate-200 bg-white p-6 shadow-xl">
            <div class="mb-4">
                <h2 class="text-xl font-semibold text-slate-900">Confirm action</h2>
                <p id="confirmModalMessage" class="mt-2 text-sm text-slate-600">Are you sure?</p>
            </div>
            <div class="mt-6 flex items-center justify-end gap-3">
                <button id="confirmModalCancel" type="button" class="rounded-2xl border border-slate-200 bg-slate-100 px-4 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-200">Cancel</button>
                <button id="confirmModalConfirm" type="button" class="rounded-2xl bg-slate-400 px-4 py-2 text-sm font-semibold text-white transition hover:bg-slate-500">Delete</button>
            </div>
        </div>
    </div>

    <script src="{% static 'script.js' %}"></script>
</body>
</html>
