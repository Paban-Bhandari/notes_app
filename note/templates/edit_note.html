{% extends "base.html" %}

{% block title %}
Edit Note
{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm rounded-4">
                <div class="card-body p-5">
                    <h2 class="mb-4">Edit Note</h2>
                    <form method="post" class="note-form">
                        {% csrf_token %}
                        <div class="mb-4">
                            <label class="form-label" for="title">Title</label>
                            <input id="title" type="text" name="title" value="{{ note.title }}" class="form-control form-control-lg" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label" for="content">Content</label>
                            <textarea id="content" name="content" rows="6" class="form-control" required>{{ note.content }}</textarea>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg">Update Note</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
