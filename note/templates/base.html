{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <title>{% block title %}Notes App{% endblock %}</title>
</head>
<body class="min-h-screen bg-[linear-gradient(135deg,#fff9f2_0%,#f4f8ff_100%)] text-slate-800">
    <div class="flex min-h-screen overflow-hidden">
        {% include "partials/navbar.html" %}
        <div class="ml-72 flex min-w-0 flex-1 flex-col overflow-hidden">
            <div class="flex items-center justify-between border-b border-orange-100 bg-white/90 px-4 py-3 backdrop-blur sm:px-6">
                <div class="text-[11px] font-semibold uppercase tracking-[0.25em] text-blue-700">Workspace • Notes</div>
                <div class="flex items-center gap-3 text-sm font-medium text-slate-600">
                    <span id="current-date"></span>
                    <span class="text-slate-300">•</span>
                    <span id="current-time"></span>
                </div>
            </div>
            <main class="flex-1 overflow-y-auto">
                {% block content %}{% endblock %}
                {% include "partials/footer.html" %}
            </main>
        </div>
    </div>

    <div id="confirmModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/60 px-4" aria-hidden="true">
        <div class="w-full max-w-md rounded-3xl bg-white p-6 shadow-2xl">
            <div class="mb-4">
                <h2 class="text-xl font-semibold text-slate-900">Confirm action</h2>
                <p id="confirmModalMessage" class="mt-2 text-sm text-slate-600">Are you sure?</p>
            </div>
            <div class="mt-6 flex items-center justify-end gap-3">
                <button id="confirmModalCancel" type="button" class="rounded-2xl border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-50">Cancel</button>
                <button id="confirmModalConfirm" type="button" class="rounded-2xl bg-rose-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-rose-700">Delete</button>
            </div>
        </div>
    </div>

    <script src="{% static 'script.js' %}"></script>
</body>
</html>
