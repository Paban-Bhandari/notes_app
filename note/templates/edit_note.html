{% extends "base.html" %}

{% block title %}
Edit Note
{% endblock %}

{% block content %}
<div class="mx-auto max-w-4xl px-4 py-8 sm:px-6 lg:px-8">
    <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
        <h2 class="mb-6 text-2xl font-semibold text-slate-900">Edit Note</h2>
        <form method="post" class="note-form space-y-5">
            {% csrf_token %}
            <div>
                <label class="mb-2 block text-sm font-medium text-slate-700" for="title">Title</label>
                <input id="title" type="text" name="title" value="{{ note.title }}" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm shadow-sm focus:border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-200" required>
            </div>
            <div>
                <label class="mb-2 block text-sm font-medium text-slate-700" for="content">Content</label>
                <textarea id="content" name="content" rows="8" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm shadow-sm focus:border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-200" required>{{ note.content }}</textarea>
            </div>
            <div class="flex items-center gap-3">
                <label class="inline-flex items-center gap-2 text-sm font-medium text-slate-700">
                    <input type="checkbox" name="important" class="h-4 w-4 rounded border-slate-300 text-orange-600 focus:ring-orange-500" {% if note.important %}checked{% endif %}>
                    Mark as important
                </label>
            </div>
            <button type="submit" class="rounded-2xl bg-orange-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-orange-700">Update Note</button>
        </form>
    </div>
</div>
{% endblock %}
