{% extends "base.html" %}

{% block title %}
Edit Note
{% endblock %}

{% block content %}
<div class="mx-auto max-w-4xl px-4 py-8 sm:px-6 lg:px-8">
    <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
        <h2 class="mb-6 text-2xl font-semibold text-slate-900">Edit Note</h2>
        <form method="post" class="note-form space-y-5">
            {% csrf_token %}
            <div>
                <label class="mb-2 block text-sm font-medium text-slate-700" for="title">Title</label>
                <input id="title" type="text" name="title" value="{{ note.title }}" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200" required>
            </div>
            <div>
                <label class="mb-2 block text-sm font-medium text-slate-700" for="content">Content</label>
                <textarea id="content" name="content" rows="8" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200" required>{{ note.content }}</textarea>
            </div>
            <button type="submit" class="rounded-2xl bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-700">Update Note</button>
        </form>
    </div>
</div>
{% endblock %}
