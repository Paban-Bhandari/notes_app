{% load static %}
<footer class="footer-pro mt-auto border-t border-slate-200 bg-white/95 px-6 py-10 text-slate-700 shadow-sm">
    <div class="mx-auto max-w-7xl">
        <div class="flex flex-col gap-8 md:flex-row md:items-start md:justify-between">
            <div class="flex items-start gap-4">
                <img src="{% static 'images/logo.png' %}" alt="Quick Note logo" class="h-14 w-14 rounded-3xl border border-slate-200 bg-slate-50 p-2" />
                <div>
                    <p class="text-lg font-semibold text-slate-900">Quick Note</p>
                    <p class="mt-1 max-w-md text-sm text-slate-500">A polished note workspace for fast idea capture. Simple, private, and focused.</p>
                </div>
            </div>

            <div class="flex flex-col gap-4 md:items-center md:gap-8">
                <nav class="grid w-full grid-cols-2 gap-2 text-sm text-slate-600 md:w-auto md:grid-cols-2">
                    <a class="block rounded px-2 py-1 text-left hover:bg-slate-50 hover:text-slate-900 transition" href="{% url 'about' %}">About</a>
                    <a class="block rounded px-2 py-1 text-left hover:bg-slate-50 hover:text-slate-900 transition" href="{% url 'home' %}?view=important">Bookmarks</a>
                    <a class="block rounded px-2 py-1 text-left hover:bg-slate-50 hover:text-slate-900 transition" href="{% url 'home' %}?view=archived">Archive</a>
                    <a class="block rounded px-2 py-1 text-left hover:bg-slate-50 hover:text-slate-900 transition" href="{% url 'home' %}?view=trash">Trash</a>
                </nav>
            </div>
        </div>

        <div class="mt-8 border-t border-slate-100 pt-6 text-center md:text-left md:flex md:items-center md:justify-between">
            <div class="text-xs text-slate-500">© 2026 Quick Note. All rights reserved.</div>
            <div class="mt-3 text-xs text-slate-400 md:mt-0">Built with Django — designed for a private, no-nonsense note-taking experience.</div>
        </div>
    </div>
</footer>
